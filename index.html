<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="泽宝小天地" />
<meta name="theme-color" content="#FFD9A8" />
<meta name="format-detection" content="telephone=no" />
<title>泽宝小天地 · 汪汪队学习桌</title>
<link rel="apple-touch-icon" href="assets/icons/icon-180.png?v9" />
<link rel="icon" href="assets/icons/icon-180.png?v9" />
<link rel="stylesheet" href="css/app.css?v9" />
</head>
<body>
<div id="app">

  <!-- 左侧固定窄栏：永久显示，不抽屉 -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">
      <img class="sb-avatar" id="sbAvatar" src="assets/img/zebao.jpg" alt="泽宝" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=\'sb-avatar-fallback\'>泽</div>');" />
      <div class="sb-name">泽宝小天地</div>
      <div class="sb-streak" id="sbStreak">🔥 0 天</div>
    </div>
    <ul class="sb-nav" id="sbNav">
      <li data-route="home"        class="active"><span class="sb-ico">🚓</span><span class="sb-lbl">首页</span></li>
      <li data-route="chinese"><span class="sb-ico">🚒</span><span class="sb-lbl">语文</span></li>
      <li data-route="math"><span class="sb-ico">🐕</span><span class="sb-lbl">数学</span></li>
      <li data-route="calligraphy"><span class="sb-ico">✏️</span><span class="sb-lbl">书法</span></li>
      <li data-route="habit"><span class="sb-ico">🪥</span><span class="sb-lbl">习惯</span></li>
      <li data-route="wishlist"><span class="sb-ico">⭐</span><span class="sb-lbl">愿望</span></li>
      <li data-route="rewards"><span class="sb-ico">🦴</span><span class="sb-lbl">奖励</span></li>
      <li data-route="settings"><span class="sb-ico">⚙️</span><span class="sb-lbl">设置</span></li>
    </ul>
    <div class="sb-foot">v1.0</div>
  </aside>

  <!-- 右侧主区 -->
  <div class="main">
    <!-- 顶部条 -->
    <header class="topbar">
      <div class="topbar-icon" id="topbarIcon">🏠</div>
      <div class="topbar-titles">
        <div class="topbar-sub">汪汪队 · 学习任务</div>
        <div class="topbar-main" id="topbarTitle">首页</div>
      </div>
      <div class="topbar-right">
        <div class="bone-chip" id="boneChipTop" title="骨头余额">
          <span class="bone-emoji">🦴</span><span id="boneCount">0</span>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="content" id="content"></main>
  </div>

  <!-- 吐司 -->
  <div id="toast" class="toast" hidden></div>
</div>

<script src="js/data.js?v9"></script>
<script src="js/app.js?v9"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
  }
</script>
</body>
</html>
